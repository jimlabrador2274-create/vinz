<!DOCTYPE html>
<html lang="id">
<head>

<title>vinzzz</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#8a8a8e;--card:#f2f2f7;--line:#e5e5ea;--red:#fa2d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--mut:#98989d;--card:#1c1c1e;--line:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--mut:#98989d;--card:#1c1c1e;--line:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
main{flex:1;min-width:0;overflow-x:hidden;overflow-y:auto;padding:16px 16px 150px}
h1{font-size:32px;margin:8px 0 16px;letter-spacing:-.5px}
h2{font-size:20px;margin:22px 0 10px}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{cursor:pointer}
.card .art{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.card b,.row b{display:block;font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span,.row span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .t{flex:1;min-width:0}.row b{margin:0}
.row .art{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;font-size:22px}
.row.cur b{color:var(--red)}
input,textarea{width:100%;background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:12px;font:inherit;font-size:16px;margin:0 0 10px}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:4px 0 4px}
input[type=file]{padding:10px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg);margin-top:8px}
.fc{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}.fc button{flex:none;background:var(--card);color:var(--fg);border:0;border-radius:16px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}.fc button.on{background:var(--red);color:#fff}
.sm{background:none;border:0;color:var(--red);font-size:14px;padding:6px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.5}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:4px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--red)}
#mini{position:absolute;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:14px;display:none;align-items:center;gap:10px;padding:8px 10px;z-index:4;box-shadow:0 4px 20px rgba(0,0,0,.2);cursor:pointer}
#mini .art{width:42px;height:42px;border-radius:6px;object-fit:cover;font-size:18px}
#mini .t{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini button,.ctl button{background:none;border:0;color:var(--fg);font-size:22px;cursor:pointer;padding:6px 10px}
#full{position:fixed;inset:0;background:linear-gradient(180deg,var(--tint,#6b6b70),color-mix(in srgb,var(--tint,#6b6b70) 35%,#000));color:#fff;z-index:10;transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#full.open{transform:none}
#full .top{display:flex;justify-content:space-between}
#stage{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;margin:10px 0}
#stage .art{width:100%;max-width:340px;aspect-ratio:1;border-radius:14px;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:90px}
#lyr{display:none;width:100%;height:100%;overflow-y:auto;padding:30vh 0;text-align:left}
#lyr p{font-size:26px;font-weight:700;margin:0 0 18px;color:var(--mut);opacity:.6;transition:.25s}
#lyr p.act{color:var(--fg);opacity:1}
#lyr.plain p{opacity:1;color:var(--fg);font-size:20px}
#full.ly #lyr{display:block}#full.ly #stage .art{display:none}
#full h3{margin:0;font-size:22px}#full .sub{color:rgba(255,255,255,.65);font-size:17px;margin-bottom:12px}
#seek{accent-color:var(--red);width:100%;padding:0;background:none;margin:0}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:10px}
.ctl button{font-size:34px}.ctl .pp{font-size:48px}
.ctl .ly.on{color:var(--red)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}.brow .btn{margin:0;padding:11px 8px;font-size:14px}
#sync,#pe,#fp{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}#sync.open,#pe.open,#fp.open{display:flex}
#pe .top{display:flex;justify-content:space-between;align-items:center}#syncL{flex:1;overflow-y:auto;padding:10px 0}
#syncL p{font-size:18px;margin:0 0 12px;color:var(--mut)}#syncL p.now{color:var(--fg);font-weight:700;font-size:22px}#syncL p.done{opacity:.5}
#tap{padding:24px;font-size:18px}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
#full button{color:#fff}
#bigArt{width:100%;display:flex;justify-content:center}
#bigArt .art{transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform:scale(.82)}
body.playing #bigArt .art{transform:scale(1)}
.ttl{display:flex;align-items:center;gap:8px}.ttl h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fav{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
#seek{height:6px}#full .time{color:rgba(255,255,255,.65)}
.vol{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:14px}.vol input{flex:1;accent-color:#fff;padding:0;background:none;margin:0}
.bot{display:flex;justify-content:space-around;margin-top:6px}.bot button{background:none;border:0;font-size:24px;opacity:.6;cursor:pointer;padding:8px 24px}.bot button.on{opacity:1}
#full #lyr p{color:rgba(255,255,255,.5)}#full #lyr p.act,#full #lyr.plain p{color:#fff}
#qv{display:none;width:100%;height:100%;overflow-y:auto}
#full.qu #qv{display:block}#full.qu #lyr,#full.qu #bigArt{display:none}
#qv .row{border-color:rgba(255,255,255,.2)}#qv .row span{color:rgba(255,255,255,.65)}#qv .row.cur b{color:#fff;text-decoration:underline}
.ttl{margin-bottom:30px}#seek{margin-top:6px}#full .time{margin-top:8px;font-size:13px}
.ctl{gap:44px;margin:26px 0 10px}.ctl svg{display:block}
#miniPP svg,#miniNext svg{width:24px;height:24px}
.fpn{font-size:38px;font-weight:700;margin:14px 0 0;letter-spacing:-1px}.fps{color:var(--mut);font-size:14px;min-height:20px;margin:2px 0}
.fpb{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin:10px 0}
.fpb i{display:block;height:100%;width:0;background:var(--red);border-radius:5px;transition:width .4s}
.fpb.ind{height:5px}.fpb.ind i{width:35%;animation:ind 1.2s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
.fpl{flex:1;overflow-y:auto;margin-top:10px}
.fpr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.fpr .ic{width:24px;text-align:center;flex:none}.fpr .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fpr small{color:var(--mut);flex:none}
.fpr.now{font-weight:700}.fpr.ok .ic{color:#30b050}.fpr.fail .ic{color:var(--red)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.plt{display:flex;justify-content:space-between;align-items:center}
.plbtn{background:var(--red);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer}
.pld{text-align:center;margin-bottom:8px}.pld h2{margin:6px 0 2px}.pld>span{color:var(--mut);font-size:14px}
.pld .art{width:200px;height:200px;border-radius:12px;object-fit:cover;margin:8px auto;display:flex;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pb{display:flex;justify-content:center;gap:8px;margin:12px 0}.pb button{background:var(--card);color:var(--fg);border:0;border-radius:20px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer}.pb button:first-child{background:var(--red);color:#fff}
#peB{flex:1;overflow-y:auto;padding:10px 0}
.sh{display:flex;flex-direction:column;align-items:flex-start}.sh .sm{padding:4px 0;font-size:16px}
.smenu button{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);color:var(--fg);border:0;border-radius:16px;padding:16px;margin:0 0 10px;text-align:left;cursor:pointer;font:inherit}
.smenu i{font-style:normal;font-size:24px;width:46px;height:46px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.smenu b{display:block;font-size:17px}.smenu small{color:var(--mut);font-size:13px}
.seg{display:flex;gap:8px;margin:6px 0 18px}.seg button{flex:1;background:var(--card);color:var(--fg);border:2px solid transparent;border-radius:12px;padding:13px 6px;font:inherit;font-size:15px;cursor:pointer}.seg button.on{border-color:var(--red);font-weight:700}
.stg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.stg div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}.stg b{display:block;font-size:20px}.stg span{font-size:12px;color:var(--mut)}
.rk{width:26px;font-weight:700;color:var(--red);text-align:center;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.ghost{background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:8px 10px;pointer-events:none;border:0}
.ph0{opacity:.25}
#plBox .row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cb{width:22px!important;height:22px;margin:0!important;flex:none;accent-color:var(--red);padding:0!important}
#full.ly #bigArt{display:none}
.mh{display:none;align-items:center;gap:12px;margin:8px 0 4px}
#full.ly .mh{display:flex}#full.ly .ttl{display:none}
.mh .art{width:56px;height:56px;border-radius:8px;object-fit:cover;font-size:22px;box-shadow:none}
.mh .mt{flex:1;min-width:0}.mh b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mh .a{font-size:14px;color:rgba(255,255,255,.65)}
#mhFav{background:none;border:0;font-size:22px;cursor:pointer}
#full.ly #stage{align-items:flex-start}
#full.ly #lyr{padding:14vh 0 32vh;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 82%,transparent)}
#full #lyr p{filter:blur(2.5px);font-size:30px;line-height:1.2}
#full #lyr p.act,#full #lyr.plain p{filter:none}
#seek,#vol{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(#fff,#fff) 0 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.3)}
#vol{--p:100%;height:5px}
#seek::-webkit-slider-thumb,#vol::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
#seek::-moz-range-thumb,#vol::-moz-range-thumb{width:0;height:0;border:0}
#seek::-webkit-slider-runnable-track{background:transparent}
select{width:100%;background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:11px;font:inherit;font-size:14px}
.bot button{width:56px;height:56px;border-radius:50%;padding:0}.bot button.on{background:rgba(255,255,255,.25);opacity:1}
</style>
</head>
<body>
<div id="app">
<main>
  <section class="view on" id="v-home"><h1 style="display:flex;align-items:center;gap:12px"><img src="logo.jpg" alt="" width="44" height="44" style="border-radius:50%;object-fit:cover">vinzzz</h1><div id="home"></div></section>
  <section class="view" id="v-lib"><h1>Pustaka</h1><input id="q" type="search" placeholder="Cari lagu, artis, album"><div id="list"></div></section>
  <section class="view" id="v-al"><h1>Album</h1><div id="alBox"></div></section>
  <section class="view" id="v-pl"><div id="plTop" class="plt"><h1>Playlist</h1><button class="plbtn" id="plNew">+ Baru</button></div><div id="plBox"></div></section>
  <section class="view" id="v-set">
    <div class="sh"><button class="sm" id="setBack" style="display:none">‹ Pengaturan</button><h1 id="setT">Pengaturan</h1></div><div class="hint" id="stor"></div>
    <div id="setMenu" class="smenu">
      <button data-sp="add"><i>＋</i><span><b>Masukin Lagu</b><small>Tambah lagu, foto album, dan lirik</small></span></button>
      <button data-sp="stats"><i>▤</i><span><b>Statistik Lagu</b><small>Lagu yang paling sering kamu dengar</small></span></button>
      <button data-sp="look"><i>◐</i><span><b>Tampilan</b><small>Mode gelap/putih dan bahasa</small></span></button>

      <div class="seg" id="segLang"><button data-lg="id">Indonesia</button><button data-lg="en">English</button><button data-lg="fil">Filipino</button></div>
    </div>
  </section>
</main>
<div id="mini"><div id="miniArt"></div><div class="t" id="miniT"></div><button id="miniPP">▶︎</button><button id="miniNext">⏭</button></div>

<audio id="au"></audio>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let songs=[],cur=null,editId=null,lrc=null,db=null,mFilter='';
const au=$('au');

/* ---------- penyimpanan (IndexedDB) ---------- */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('musik',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function op(mode,fn){return new Promise((res,rej)=>{if(!db)return rej(new Error('nodb'));try{const t=db.transaction('songs',mode),q=fn(t.objectStore('songs'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error||new Error('tx'))}catch(e){rej(e)}})}
async function persist(s){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}const {url,coverUrl,...rec}=s;try{await op('readwrite',st=>st.put(rec));return true}catch(e){return false}}
function hydrate(s){s.url=URL.createObjectURL(s.audio);s.coverUrl=s.cover?URL.createObjectURL(s.cover):null}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- tampilan ---------- */
const hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
function art(s,cls){return s.coverUrl?`<img class="art ${cls||''}" src="${s.coverUrl}" alt="">`:`<div class="art ph ${cls||''}" style="background:linear-gradient(135deg,hsl(${hue(s.title)},70%,58%),hsl(${(hue(s.title)+50)%360},70%,38%))">♪</div>`}
function rowHTML(s,extra){return `<div class="row ${cur&&cur.id===s.id?'cur':''}" data-id="${s.id}">${art(s)}<div class="t"><b>${esc(s.title)}</b><span>${esc(s.artist||'Artis tidak diketahui')}${s.album?' · '+esc(s.album):''}</span></div>${extra||''}</div>`}
const emptyMsg='<div class="empty">Belum ada lagu.<br>Buka <b>Pengaturan</b> untuk menambahkan lagu, lirik, dan foto album.</div>';
function render(){renderPL();renderAL();
  $('home').innerHTML=songs.length?`<h2 style="margin-top:0">Baru Ditambahkan</h2><div class="grid">${songs.map(s=>`<div class="card" data-id="${s.id}">${art(s)}<b>${esc(s.title)}</b><span>${esc(s.artist||'')}</span></div>`).join('')}</div>`:emptyMsg;
  const q=$('q').value.toLowerCase();
  const f=songs.filter(s=>(s.title+' '+s.artist+' '+(s.album||'')).toLowerCase().includes(q));
  $('list').innerHTML=f.length?f.map(s=>rowHTML(s)).join(''):emptyMsg;
  const mq=$('mq').value.toLowerCase().trim();
  const blank=v=>!v||!String(v).trim();
  const miss={lirik:s=>blank(s.lyrics),foto:s=>!s.cover,album:s=>blank(s.album),artis:s=>blank(s.artist),judul:s=>blank(s.title)};
  const mfLab=[['','Semua'],['lirik','Tanpa lirik'],['foto','Tanpa foto album'],['album','Tanpa album'],['artis','Tanpa artis'],['judul','Tanpa judul']];
  $('mf').innerHTML=mfLab.map(([k,l])=>`<button data-mf="${k}" class="${mFilter===k?'on':''}">${l}${k?' ('+songs.filter(miss[k]).length+')':''}</button>`).join('');
  const fm=songs.filter(s=>(s.title+' '+(s.artist||'')+' '+(s.album||'')).toLowerCase().includes(mq)&&(!mFilter||miss[mFilter](s)));
  $('mine').innerHTML=!songs.length?'<div class="empty">Belum ada lagu tersimpan.</div>':fm.length?fm.map(s=>rowHTML(s,`<button class="sm" data-e="${s.id}">Edit</button><button class="sm" data-d="${s.id}">Hapus</button>`)).join(''):'<div class="empty">'+(mFilter&&!mq?'Semua lagu sudah lengkap untuk kategori ini.':'Tidak ada lagu yang cocok.')+'</div>';
}

/* ---------- form tambah/edit ---------- */
function resetForm(){editId=null;['f-title','f-artist','f-album','f-audio','f-cover','f-lyrics'].forEach(i=>$(i).value='');$('formTitle').textContent='Tambah Lagu';$('cancel').style.display='none';$('aNote').textContent=''}
function startEdit(id){const s=songs.find(x=>x.id===id);if(!s)return;editId=id;$('f-title').value=s.title;$('f-artist').value=s.artist||'';$('f-album').value=s.album||'';$('f-lyrics').value=s.lyrics||'';$('formTitle').textContent='Edit Lagu';$('cancel').style.display='block';$('aNote').textContent='(kosongkan jika tidak diganti)';window.scrollTo(0,0);document.querySelector('main').scrollTop=0}
$('cancel').onclick=resetForm;
function cleanTitle(t){
  return String(t).replace(/\s*[\(\[]?\s*(www\.)?([a-z0-9-]+\.(org|com|net|io|info|xyz|app|cc)|spotdown)\s*[\)\]]?/ig,' ').replace(/\s{2,}/g,' ').replace(/[\s\-–_]+$/,'').trim();
}
function parseName(fn){
  let b=fn.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/\s+/g,' ').trim();
  b=b.replace(/^\d{1,3}\s*[-.)]\s*/,'');b=cleanTitle(b);
  b=b.replace(/\s*[\(\[]\s*(official|lirik|lyrics?|audio|video|mv)[^\)\]]*[\)\]]/ig,'').trim();
  const m=b.match(/^(.+?)\s+[-–]\s+(.+)$/);
  return m?{artist:m[1].trim(),title:m[2].trim()}:{artist:'',title:b||fn};
}
let autoT='',autoA='';
$('f-audio').onchange=e=>{
  const fl=[...e.target.files];if(!fl.length)return;
  const T=$('f-title'),A=$('f-artist');
  if(fl.length===1){
    const n=parseName(fl[0].name);
    if(!T.value.trim()||T.value===autoT){T.value=n.title;autoT=n.title}
    if(n.artist&&(!A.value.trim()||A.value===autoA)){A.value=n.artist;autoA=n.artist}
    if(!editId)$('aNote').textContent='';
    readTags(fl[0]).then(t=>{if(t.artist&&(!A.value.trim()||A.value===autoA)){A.value=t.artist;autoA=t.artist}if(t.album&&!$('f-album').value.trim())$('f-album').value=t.album}).catch(()=>{});
  }else{
    if(T.value===autoT)T.value='';
    $('aNote').textContent='('+fl.length+' lagu dipilih, judul diisi otomatis dari nama file)';
  }
};
$('save').onclick=async()=>{
  const fl=[...$('f-audio').files];
  if(!editId&&fl.length>1){
    const c=$('f-cover').files[0],artistDef=$('f-artist').value.trim(),btn=$('save');
    btn.disabled=true;let ok=0,fail=0;
    for(let i=0;i<fl.length;i++){
      const n=parseName(fl[i].name),tg=await readTags(fl[i]).catch(()=>({}));
      const s={id:Date.now()-i,title:n.title,artist:artistDef||tg.artist||n.artist||'',album:tg.album||'',lyrics:'',audio:fl[i]};
      if(c)s.cover=c;
      hydrate(s);songs.splice(i,0,s);
      (await persist(s))?ok++:fail++;
      btn.textContent='Menyimpan '+(i+1)+'/'+fl.length+'...';
    }
    btn.disabled=false;btn.textContent='Simpan Lagu';resetForm();render();
    toast(fail?ok+' lagu tersimpan, '+fail+' hanya sementara':fl.length+' lagu berhasil diimpor');
    return;
  }
  const title=$('f-title').value.trim()||(fl[0]?parseName(fl[0].name).title:'');if(!title)return toast('Judul wajib diisi');
  const a=$('f-audio').files[0],c=$('f-cover').files[0];
  let s=editId?songs.find(x=>x.id===editId):null;
  if(!s&&!a)return toast('Pilih file lagu dulu');
  const isNew=!s;if(isNew)s={id:Date.now()};
  s.title=title;s.artist=$('f-artist').value.trim();s.album=$('f-album').value.trim();s.lyrics=$('f-lyrics').value;
  if(a)s.audio=a;if(c)s.cover=c;
  hydrate(s);if(isNew)songs.unshift(s);
  const ok=await persist(s);resetForm();render();
  if(cur&&cur.id===s.id){cur=s;setUI()}
  toast(ok?'Lagu tersimpan permanen':'Tersimpan sementara: penyimpanan browser tidak tersedia');
};
async function del(id){
  if(!confirm('Hapus lagu ini?'))return;
  try{await op('readwrite',st=>st.delete(id))}catch(e){}
  songs=songs.filter(s=>s.id!==id);
  if(cur&&cur.id===id){au.pause();au.removeAttribute('src');cur=null;$('mini').style.display='none';$('full').classList.remove('open')}
  render();
}

const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
function play(id,keep){if(!keep)q=null;cur=songs.find(s=>s.id===id);if(!cur)return;au.src=cur.url;au.play().catch(()=>{});setUI();render()}
function step(d){if(!songs.length||!cur)return;const L=curList(),i=L.findIndex(s=>s.id===cur.id);play(L[(i+d+L.length)%L.length].id,true)}
function parseLyrics(t){
  const lines=(t||'').split('\n'),out=[];let timed=false;
  for(const l of lines){const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);if(m){timed=true;out.push({t:+m[1]*60+ +m[2],x:m[3]})}else if(l.trim())out.push({t:null,x:l.trim()})}
  return {timed,lines:out};
}

/* ---------- tag ID3 ---------- */
function txt(d){
  if(!d.length)return '';const e=d[0],b=d.subarray(1);let s;
  if(e===0)s=new TextDecoder('windows-1252').decode(b);
  else if(e===3)s=new TextDecoder('utf-8').decode(b);
  else if(e===2)s=new TextDecoder('utf-16be').decode(b);
  else if(b[0]===0xFE&&b[1]===0xFF)s=new TextDecoder('utf-16be').decode(b.subarray(2));
  else if(b[0]===0xFF&&b[1]===0xFE)s=new TextDecoder('utf-16le').decode(b.subarray(2));
  else s=new TextDecoder('utf-16le').decode(b);
  return s.split('\0').map(x=>x.replace(/^\uFEFF/,'').trim()).filter(Boolean).join(', ');
}
async function readTags(file){
  const out={title:'',artist:'',album:''};
  const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
  if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){
    const ver=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
    const buf=new Uint8Array(await file.slice(10,10+Math.min(sz,4000000)).arrayBuffer());
    const v2=ver===2,hl=v2?6:10,idl=v2?3:4;let p=0;
    while(p+hl<=buf.length){
      const id=String.fromCharCode(...buf.subarray(p,p+idl));
      if(!/^[A-Z0-9]{3,4}$/.test(id))break;
      let fs;
      if(v2)fs=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
      else if(ver===4)fs=((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127);
      else fs=((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0;
      if(!fs||p+hl+fs>buf.length)break;
      const m={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TALB:'album',TAL:'album'}[id];
      if(m&&!out[m])out[m]=txt(buf.subarray(p+hl,p+hl+fs));
      p+=hl+fs;
    }
  }
  if(!out.artist&&file.size>128){
    const t=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
    if(t[0]===0x54&&t[1]===0x41&&t[2]===0x47){
      const g=(a,b)=>new TextDecoder('windows-1252').decode(t.slice(a,b)).replace(/\0[\s\S]*$/,'').trim();
      out.title=out.title||g(3,33);out.artist=g(33,63);out.album=out.album||g(63,93);
    }
  }
  return out;
}
/* ---------- album ---------- */
let alOpen=null;
function albums(){
  const m=new Map();
  for(const x of songs){
    const a=(x.album||'').trim(),k=a?a.toLowerCase()+'|'+String(x.artist||'').toLowerCase().split(/,|&|;/)[0].trim():'';
    if(!m.has(k))m.set(k,{key:k,name:a||'Tanpa Album',songs:[]});
    m.get(k).songs.push(x);
  }
  return [...m.values()].sort((a,b)=>(a.key===''?1:0)-(b.key===''?1:0)||b.songs.length-a.songs.length||a.name.localeCompare(b.name));
}
function renderAL(){
  const el=$('alBox'),G=albums(),g=alOpen!==null&&G.find(x=>x.key===alOpen);
  if(!g){alOpen=null;
    el.innerHTML=G.length?'<div class="grid">'+G.map(x=>{const c=x.songs.find(s=>s.coverUrl)||x.songs[0];
      return '<div class="card" data-al="'+esc(x.key)+'">'+art(c)+'<b>'+esc(x.name)+'</b><span>'+esc((x.key===''?'':(x.songs[0].artist||'')+' · ')+x.songs.length+' lagu')+'</span></div>'}).join('')+'</div>':emptyMsg;
    return}
  const c=g.songs.find(s=>s.coverUrl)||g.songs[0];

const D=new Map(L.map(r=>[r[0],{en:r[1],fil:r[2]}]));
const RULES=[[/\b(\d+) lagu\b/g,{en:'$1 songs',fil:'$1 kanta'}],[/\b(\d+) kali\b/g,{en:'$1 plays',fil:'$1 beses'}],[/\b(\d+) baris\b/g,{en:'$1 lines',fil:'$1 linya'}],[/^Memproses (\d+)\/(\d+)\.\.\.$/,{en:'Processing $1/$2...',fil:'Pinoproseso $1/$2...'}]];
let lang='id',theme='auto';
function trs(s){
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),e=D.get(m[2]);
  if(e&&e[lang])return m[1]+e[lang]+m[3];
  let o=s;for(const r of RULES)o=o.replace(r[0],r[1][lang]);return o;
}
const NOTR='.t b,.card b,.tt,#fT,#mhT,#miniT,.pld h2,#lyr';
function trNode(n){
  const pe=n.parentNode;if(!pe||/^(SCRIPT|STYLE|TEXTAREA)$/.test(pe.nodeName))return;
  if(pe.closest&&pe.closest(NOTR))return;
  if(n.__t===undefined||n.data!==n.__t)n.__o=n.data;
  const t=lang==='id'?n.__o:trs(n.__o);
  n.__t=t;if(n.data!==t)n.data=t;
}
function walk(root){
  if(root.nodeType===3){trNode(root);return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;
  while(n=w.nextNode())a.push(n);a.forEach(trNode);
}
function trAttrs(){document.querySelectorAll('[placeholder]').forEach(e=>{if(e.dataset.po===undefined)e.dataset.po=e.getAttribute('placeholder');e.setAttribute('placeholder',lang==='id'?e.dataset.po:trs(e.dataset.po))})}
new MutationObserver(ms=>{
  if(lang==='id')return;
  for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(walk)}
}).observe(document.body,{childList:true,characterData:true,subtree:true});
function segs(){
  document.querySelectorAll('#segTheme [data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===theme));
  document.querySelectorAll('#segLang [data-lg]').forEach(b=>b.classList.toggle('on',b.dataset.lg===lang));
}
function setTheme(t,save){theme=t;const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);segs();if(save)setPref()}
function setLang(l,save){lang=l;document.documentElement.lang=l;walk(document.body);trAttrs();segs();if(typeof view!=='undefined'&&view.sp==='stats')renderStats();if(save)setPref()}
function setPref(){try{localStorage.setItem('vz_theme',theme);localStorage.setItem('vz_lang',lang)}catch(e){}stats.prefs={theme,lang};stDirty=true}

let stats={id:'stats',st:true,plays:{},secs:{},last:{}},stDirty=false,lastT=0,counted=false;
au.addEventListener('loadstart',()=>{counted=false;lastT=0});
au.addEventListener('timeupdate',()=>{
  if(!cur)return;
  const t=au.currentTime,d=t-lastT;lastT=t;
  if(d>0&&d<1.5){stats.secs[cur.id]=(stats.secs[cur.id]||0)+d;stDirty=true}
  if(!counted&&t>=Math.min(30,(au.duration||60)/2)){counted=true;stats.plays[cur.id]=(stats.plays[cur.id]||0)+1;stats.last[cur.id]=Date.now();stDirty=true}
});
const flush=()=>{if(stDirty){stDirty=false;persist(stats)}};
setInterval(flush,8000);au.addEventListener('pause',flush);

const UN={id:['j','m','d'],en:['h','m','s'],fil:['o','m','s']};
function fmtDur(x){const u=UN[lang]||UN.id,h=Math.floor(x/3600),m=Math.floor(x%3600/60);return h?h+u[0]+' '+m+u[1]:m?m+u[1]+' '+Math.floor(x%60)+u[2]:Math.floor(x)+u[2]}
function renderStats(){
  const T=songs.map(x=>({s:x,p:stats.plays[x.id]||0,t:stats.secs[x.id]||0})).filter(x=>x.p||x.t),el=$('setStats');
  if(!T.length){el.innerHTML='<div class="empty">Belum ada data. Putar lagu dulu, statistik muncul otomatis.</div>';return}
  const totP=T.reduce((a,x)=>a+x.p,0),totT=T.reduce((a,x)=>a+x.t,0);
  const top=T.filter(x=>x.p).sort((a,b)=>b.p-a.p||b.t-a.t).slice(0,10),mx=top.length?top[0].p:1;
  const am=new Map();T.forEach(x=>{const k=x.s.artist||'';if(k)am.set(k,(am.get(k)||0)+x.p)});
  const ar=[...am].filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).slice(0,5),ma=ar.length?ar[0][1]:1;
  el.innerHTML='<div class="stg"><div><b>'+totP+'</b><span>Total diputar</span></div><div><b>'+fmtDur(totT)+'</b><span>Waktu mendengar</span></div><div><b>'+T.length+'</b><span>Lagu unik</span></div></div>'
    +'<h2>Lagu paling sering didengar</h2>'+top.map((x,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span>'+art(x.s)+'<div class="t"><b>'+esc(x.s.title)+'</b><span>'+esc(x.s.artist||'')+' · '+x.p+' kali</span><div class="bar"><i style="width:'+Math.round(x.p/mx*100)+'%"></i></div></div></div>').join('')
    +(ar.length?'<h2>Artis teratas</h2>'+ar.map((a,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span><div class="t"><b>'+esc(a[0])+'</b><span>'+a[1]+' kali</span><div class="bar"><i style="width:'+Math.round(a[1]/ma*100)+'%"></i></div></div></div>').join(''):'')
    +'<button class="btn sec" id="stReset" style="margin-top:16px">Reset statistik</button>';
  $('stReset').onclick=()=>{if(confirm('Reset statistik?')){stats.plays={};stats.secs={};stats.last={};stDirty=true;flush();renderStats()}};
}

/* ---------- playlist: tahan lalu geser untuk mengubah urutan ---------- */
let dr=null,dragSup=false,lpT=null,lpRow=null,lpX=0,lpY=0;
function dStart(row,y){
  const r=row.getBoundingClientRect(),g=row.cloneNode(true);
  g.className='row ghost';g.style.cssText='position:fixed;left:'+r.left+'px;width:'+r.width+'px;top:'+r.top+'px;z-index:40;margin:0';
  document.body.appendChild(g);row.classList.add('ph0');
  dr={row,g,off:y-r.top,y,sp:0};
  dr.tm=setInterval(()=>{if(dr&&dr.sp){document.querySelector('main').scrollTop+=dr.sp;dMove(dr.y)}},16);
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}
function dMove(y){
  if(!dr)return;
  dr.y=y;dr.g.style.top=(y-dr.off)+'px';
  const sibs=[...$('plBox').querySelectorAll('[data-ps]')].filter(x=>x!==dr.row);
  let before=null;
  for(const x of sibs){const b=x.getBoundingClientRect();if(y<b.top+b.height/2){before=x;break}}
  if(before){if(dr.row.nextSibling!==before)before.parentNode.insertBefore(dr.row,before)}
  else{const last=sibs[sibs.length-1];if(last&&last.nextSibling!==dr.row)last.after(dr.row)}
  const mb=document.querySelector('main').getBoundingClientRect();
  dr.sp=y<mb.top+90?-10:y>mb.bottom-170?10:0;
}
function dEnd(){
  if(!dr)return;
  clearInterval(dr.tm);dr.g.remove();dr.row.classList.remove('ph0');
  const ids=[...$('plBox').querySelectorAll('[data-ps]')].map(x=>+x.dataset.ps),p=lists.find(x=>x.id===plOpen);
  if(p){p.songIds=ids;persist(p);if(q&&cur&&ids.includes(cur.id))q=ids.slice()}
  dr=null;dragSup=true;setTimeout(()=>{dragSup=false},450);
}
const pbx=$('plBox');
const lpStart=(row,x,y)=>{lpRow=row;lpX=x;lpY=y;clearTimeout(lpT);lpT=setTimeout(()=>{if(lpRow){dStart(lpRow,lpY);dMove(lpY)}},350)};
const lpEnd=()=>{clearTimeout(lpT);lpRow=null;dEnd()};
pbx.addEventListener('touchstart',e=>{const row=e.target.closest('[data-ps]');if(row&&e.touches.length===1)lpStart(row,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];if(!t)return;
  if(dr){e.preventDefault();dMove(t.clientY);return}
  if(lpRow&&(Math.abs(t.clientY-lpY)>10||Math.abs(t.clientX-lpX)>10)){clearTimeout(lpT);lpRow=null}
},{passive:false});
document.addEventListener('touchend',lpEnd);document.addEventListener('touchcancel',lpEnd);
pbx.addEventListener('mousedown',e=>{const row=e.target.closest('[data-ps]');if(row&&!e.button)lpStart(row,e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>{if(dr)dMove(e.clientY);else if(lpRow&&(Math.abs(e.clientY-lpY)>6||Math.abs(e.clientX-lpX)>6)){clearTimeout(lpT);lpRow=null}});
document.addEventListener('mouseup',lpEnd);

  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v.tab));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v.tab));

function back(){if(histOK){try{history.back();return}catch(e){}}view={...view,full:false,pe:false};apply(view)}
try{
  history.replaceState({...view,root:true},'');
